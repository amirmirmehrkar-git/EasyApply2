<div style="display: flex; align-items: center; justify-content: center" 
     ng-controller="masterController as vm" ng-init="vm.initializeController()">

    <div  style="box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15) !important;" class="auth-card">
        <div class="robot-circle" style="height:70px;width:70px" aria-hidden="true">
            <img src="/images/logo.png" style="height:50px">
        </div>
        <h1>Welcome Back</h1>

        <!-- CSS-only tabs -->
        <input type="radio" id="tab-login" name="auth" checked>
        <input type="radio" id="tab-register" name="auth">

        <div class="tabs">
            <label class="box3" for="tab-login">Login</label>
            <label class="box3" for="tab-register">Register</label>
        </div>

        <div class="tab-content">
            <!-- LOGIN -->
            <section id="login">
                <form name="form" ng-submit="vm.login()" novalidate>
                    <div class="field" ng-class="{'has-error':form.$submitted && form.Email.$error.required}">
                        <label>Email</label>
                        <input name="Email" ng-model="vm.item.Email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field" ng-class="{'has-error':form.$submitted && form.Password.$error.required}">
                        <label>Password</label>
                        <input name="Password" ng-model="vm.item.Password" type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="box3 btn">Login</button>
                    <div class="switch-text">
                        Don't have an account? <span>Register</span>
                    </div>
                </form>
            </section>

            <!-- REGISTER -->
            <section id="register">
                <form name="formSignUp" ng-submit="vm.signUp()" novalidate>
                    <div class="row">
                        <div class="col-md-6 field" ng-class="{'has-error':formSignUp.$submitted && formSignUp.FirstName.$error.required}">
                            <label>First Name</label>
                            <input name="FirstName" ng-model="vm.item.FirstName" type="text" placeholder="Your name" required>
                        </div>
                        <div class="col-md-6 field" ng-class="{'has-error':formSignUp.$submitted && formSignUp.LastName.$error.required}">
                            <label>Last Name</label>
                            <input name="LastName" ng-model="vm.item.LastName" type="text" placeholder="Your last name" required>
                        </div>
                    </div>
                    <div class="field" ng-class="{'has-error':formSignUp.$submitted && formSignUp.Email.$error.required}">
                        <label>Email</label>
                        <input name="Email" ng-model="vm.item.Email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field" ng-class="{'has-error':formSignUp.$submitted && formSignUp.Password.$error.required}">
                        <label>Password</label>
                        <input name="Password" ng-model="vm.item.Password" type="password" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="box3 btn">Register</button>
                    <div class="switch-text">
                        Already have an account? <span>Login</span>
                    </div>
                </form>
            </section>
        </div>

        <div class="footer-note">© 2025 Easy Actions. All rights reserved.</div>
    </div>

</div>
